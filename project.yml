name: Pokedex
configs:
  Debug_Future: debug
  Debug_Kakin: debug
  Debug_Release: debug
  Debug_Staging: debug
  Deploy_Future: debug
  Deploy_Kakin: debug
  Deploy_Staging: debug
  Dummy: debug
  Release: release
configFiles:
  Debug_Future: Configs/Debug_Future.xcconfig
  Debug_Kakin: Configs/Debug_Kakin.xcconfig
  Debug_Release: Configs/Debug_Release.xcconfig
  Debug_Staging: Configs/Debug_Staging.xcconfig
  Deploy_Future: Configs/Deploy_Future.xcconfig
  Deploy_Kakin: Configs/Deploy_Kakin.xcconfig
  Deploy_Staging: Configs/Deploy_Staging.xcconfig
  Dummy: Configs/Dummy.xcconfig
  Release: Configs/Release.xcconfig
options:
  defaultConfig: Debug_Staging
  deploymentTarget:
    iOS: 13.0
settingGroups:
  MainSettings:
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: 5.0
    DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: YES #Read: https://forums.swift.org/t/adding-a-package-to-two-targets-in-one-projects-results-in-an-error/35007
packages:
    Alamofire:
      url: https://github.com/Alamofire/Alamofire.git
      version: 5.4.3
    Nuke:
      url: https://github.com/kean/Nuke.git
      version: 10.4.1
fileGroups:
targets:
  Pokedex:
    type: application
    platform: iOS
    sources: [Pokedex]
    settings:
      groups: [MainSettings]
      configs:
        Debug_Staging:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Debug_Future:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Debug_Kakin:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Deploy_Staging:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Deploy_Future:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Deploy_Kakin:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Debug_Release:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Debug
          DEBUG_INFORMATION_FORMAT: dwarf
        Dummy:
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.Adhoc
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
    - target: DataStore
    - target: Domain
    - target: Presentation
    - target: QuizTodayExtension
      codeSign: false
      embed: true
    prebuildScripts:
      - script: |
          if which mint >/dev/null; then
            rm -f PokedexTests/Generated/MockResults.swift
            mint run mockolo mockolo -s Presentation -s Domain -s DataStore -d PokedexTests/Generated/MockResults.swift -i Presentation -i Domain -i DataStore
          else
            echo "warning: Mint not installed, download from https://github.com/yonaskolb/Mint"
          fi
        name: Generate Mocks with Mockolo
        outputFiles:
          - PokedexTests/Generated/MockResults.swift
    postbuildScripts:
      - script: |
          if which mint >/dev/null; then
            mint run swiftlint swiftlint autocorrect --format
            mint run swiftlint swiftlint
          else
            echo "warning: Mint not installed, download from https://github.com/yonaskolb/Mint"
          fi
        name: Run SwiftLint
  DataStore:
    type: framework
    platform: iOS
    sources: [DataStore]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.DataStore
      CODE_SIGN_STYLE: Automatic
      APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - package: Alamofire
      - package: Nuke
  Presentation:
    type: framework
    platform: iOS
    sources: [Presentation]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Presentation
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Domain
      - package: Nuke
  Domain:
    type: framework
    platform: iOS
    sources: [Domain]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Domain
      CODE_SIGN_STYLE: Automatic
      APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - target: DataStore
  QuizTodayExtension:
    type: app-extension
    platform: iOS
    sources: [QuizTodayExtension]
    settings:
      PRODUCT_NAME: Who is That Pokémon?
      CODE_SIGN_STYLE: Manual
      configs:
        Debug_Staging:
          CODE_SIGN_IDENTITY: Apple Development
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Debug.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Debug
        Debug_Future:
          CODE_SIGN_IDENTITY: Apple Development
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Debug.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Debug
        Debug_Kakin:
          CODE_SIGN_IDENTITY: Apple Development
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Debug.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Debug
        Deploy_Staging:
          CODE_SIGN_IDENTITY: Apple Distribution
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Adhoc.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Adhoc
        Deploy_Future:
          CODE_SIGN_IDENTITY: Apple Distribution
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Adhoc.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Adhoc
        Deploy_Kakin:
          CODE_SIGN_IDENTITY: Apple Distribution
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Adhoc.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Adhoc
        Debug_Release:
          CODE_SIGN_IDENTITY: Apple Development
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Debug.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Debug
        Dummy:
          CODE_SIGN_IDENTITY: Apple Distribution
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.Adhoc.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension.Adhoc
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PRODUCT_BUNDLE_IDENTIFIER: TomosukeOkada.Pokedex.QuizTodayExtension
          DEVELOPMENT_TEAM: NG4PAUE398
          PROVISIONING_PROFILE_SPECIFIER: Pokedex.QuizTodayExtension
    dependencies:
      - target: Domain
      - package: Nuke
      - sdk: NotificationCenter.framework
  PokedexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PokedexTests
    settings:
      base:
        INFOPLIST_FILE: PokedexTests/Info.plist
    dependencies:
      - target: Pokedex
schemes:
  Pokedex:
    build:
      targets:
        Pokedex: all
        PokedexTests: [test]
    run:
      config: Debug_Staging
    test:
      config: Debug_Staging
      targets:
        - PokedexTests
      gatherCoverageData: true
      coverageTargets:
        - Domain
        - DataStore
        - Presentation
    profile:
      config: Release
    analyze:
      config: Debug_Staging
    archive:
      config: Release